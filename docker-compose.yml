services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simass-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - simass-network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: simass-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - simass-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: simass-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_simass
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD:
      MYSQL_USER: simass
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - simass-network

networks:
  simass-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
